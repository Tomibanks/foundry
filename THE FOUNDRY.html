<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FOUNDRY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: sticky charcoal bar with one tab per document item (62 to 67); each journey is a stepper above a browser-framed screen with its functional specification beside it. */
:root{
  --bg:#F4EFEA; --surface:#FFFFFF; --surface2:#FAF6F2; --ink:#22272E; --muted:#5B6068; --line:#DDD5CC;
  --accent:#A8431A; --btn:#C2511F; --btn-ink:#FFFFFF; --gold:#E5A430; --teal:#2B6E73; --blue:#2D4A6F; --steel:#9AA1A9;
  --ok:#2A7A4B; --ok-bg:#E3F1E8; --warn:#8A5A00; --warn-bg:#FBEFD5; --bad:#B3261E; --bad-bg:#FBE4E1; --info-bg:#E5EBF3;
  --top:#22272E; --top-ink:#F7F0EA; --top-mute:#AEB4BC; --chip:#EFE7DE;
  --shadow:0 1px 2px rgba(34,39,46,.08),0 10px 28px rgba(34,39,46,.07);
  --fd:'Poppins','Segoe UI',Arial,sans-serif; --fb:'Carlito',Calibri,Arial,sans-serif;
}
@media (min-width:1700px){.brand small{display:inline}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15181D; --surface:#1E232A; --surface2:#252B33; --ink:#EEE8E1; --muted:#A8AEB6; --line:#343C47;
  --accent:#F08A5D; --btn:#C2511F; --gold:#E5A430; --teal:#4FA3A9; --blue:#7FA3D1; --steel:#8B939C;
  --ok:#6CC38E; --ok-bg:#1E3427; --warn:#E8B75C; --warn-bg:#3A2E14; --bad:#F2877F; --bad-bg:#3D1F1D; --info-bg:#22303F;
  --top:#0F1215; --top-ink:#F2ECE5; --top-mute:#8F96A0; --chip:#2B323B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15181D; --surface:#1E232A; --surface2:#252B33; --ink:#EEE8E1; --muted:#A8AEB6; --line:#343C47;
  --accent:#F08A5D; --btn:#C2511F; --gold:#E5A430; --teal:#4FA3A9; --blue:#7FA3D1; --steel:#8B939C;
  --ok:#6CC38E; --ok-bg:#1E3427; --warn:#E8B75C; --warn-bg:#3A2E14; --bad:#F2877F; --bad-bg:#3D1F1D; --info-bg:#22303F;
  --top:#0F1215; --top-ink:#F2ECE5; --top-mute:#8F96A0; --chip:#2B323B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--fb);margin:0}
h1,h2,h3,h4{font-family:var(--fd);margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
.wrap{max-width:1500px;margin-inline:auto;padding-inline:16px}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--top);color:var(--top-ink)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:700;letter-spacing:.08em;font-size:15px;white-space:nowrap}
.brand small{display:none;font-weight:500;letter-spacing:.04em;color:var(--top-mute);font-size:12px}
.logo{display:block;color:inherit}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1 1 360px;min-width:0;padding-block:2px;scrollbar-width:thin}
.tabs button{background:none;border:0;color:var(--top-mute);font-family:var(--fd);font-weight:500;font-size:13px;padding:8px 9px;border-radius:8px;cursor:pointer;white-space:nowrap}
.tabs button b{font-weight:600;color:var(--gold);margin-right:6px;font-variant-numeric:tabular-nums}
.tabs button:hover{color:var(--top-ink);background:rgba(255,255,255,.08)}
.tabs button[aria-current="page"]{background:var(--btn);color:#fff}
.tabs button[aria-current="page"] b{color:#fff}
.tools{display:flex;gap:8px;align-items:center}
.tog{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--top-ink);background:rgba(255,255,255,.08);border:0;border-radius:999px;padding:6px 12px 6px 8px;cursor:pointer;font-family:var(--fd);font-weight:500}
.tog i{width:30px;height:18px;border-radius:999px;background:var(--steel);position:relative;transition:background .15s}
.tog i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.tog[aria-pressed="true"] i{background:var(--btn)}
.tog[aria-pressed="true"] i::after{transform:translateX(12px)}
.ibtn{background:rgba(255,255,255,.08);border:0;color:var(--top-ink);border-radius:999px;padding:7px 12px;cursor:pointer;font-family:var(--fd);font-size:13px;font-weight:500}
/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:700;font-size:15px;line-height:1.2}
.btn:hover{border-color:var(--steel)}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.pill{display:inline-block;font-family:var(--fd);font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--ink);white-space:nowrap;letter-spacing:.01em}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--blue)}.pill.ember{background:var(--btn);color:#fff}
.note{display:flex;gap:10px;padding:10px 14px;border-radius:10px;background:var(--info-bg);font-size:15px;line-height:1.4}
.note.warn{background:var(--warn-bg)}.note.ok{background:var(--ok-bg)}.note.bad{background:var(--bad-bg)}
.note b{font-family:var(--fd);font-weight:600;font-size:13px}
.muted{color:var(--muted)}
.lbl{font-family:var(--fd);font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--fd);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
/* overview */
.hero{padding-block:34px 18px;display:grid;gap:14px;max-width:880px}
.hero h1{font-size:clamp(28px,4.4vw,46px);font-weight:700}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{font-size:19px;color:var(--muted)}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-block:14px 8px}
.mapc{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;box-shadow:var(--shadow)}
.mapc:hover{border-color:var(--btn)}
.mapc .no{font-family:var(--fd);font-weight:700;font-size:30px;color:var(--accent);font-variant-numeric:tabular-nums}
.mapc h3{font-size:16px}.mapc p{font-size:15px;color:var(--muted)}
.sec{padding-block:26px 6px;display:grid;gap:12px}
.sec>*{min-width:0}
.sec>h2{font-size:22px;border-bottom:2px solid var(--btn);padding-bottom:8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sec>h2 small{font-size:13px;font-weight:500;color:var(--muted);font-family:var(--fb)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:6px;align-content:start;min-width:0}
.card h4{font-size:15px}.card p,.card li{font-size:15px;color:var(--muted)}
.card ul{margin:0;padding-left:18px;display:grid;gap:3px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow span{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:14px;font-weight:700}
.flow i{font-style:normal;color:var(--muted)}
.flow span.x{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.flow span.k{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
/* journey */
.jhead{padding-block:22px 12px;display:grid;gap:14px}
.jtitle{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.jtitle .no{font-family:var(--fd);font-size:44px;font-weight:700;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.jtitle h1{font-size:clamp(22px,3vw,32px)}
.persona{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.persona div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:3px;align-content:start;min-width:0}
.persona p{font-size:15px;line-height:1.35}
.stepper{display:flex;gap:6px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:thin}
.stepper button{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer;font-weight:700;font-size:15px;white-space:nowrap}
.stepper button i{font-style:normal;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--chip);font-family:var(--fd);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.stepper button[aria-current="step"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stepper button[aria-current="step"] i{background:var(--btn);color:#fff}
.stepper button.done i{background:var(--ok-bg);color:var(--ok)}
.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,430px);gap:18px;align-items:start;padding-bottom:30px}
.work.nospec{grid-template-columns:minmax(0,1fr)}
@media (max-width:1180px){.work{grid-template-columns:minmax(0,1fr)}}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
/* frame */
.frame{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.chrome{display:flex;align-items:center;gap:6px;padding:9px 12px;background:var(--surface2);border-bottom:1px solid var(--line)}
.chrome i{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.url{margin-left:8px;flex:1;min-width:0;font-size:13px;color:var(--muted);background:var(--bg);border-radius:6px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.appbar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--top);color:var(--top-ink);flex-wrap:wrap}
.appbar .rl{font-family:var(--fd);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--btn);color:#fff}
.appbar nav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto}
.appbar nav span{padding:5px 10px;font-size:14px;color:var(--top-mute);border-radius:6px;white-space:nowrap}
.appbar nav span.on{background:rgba(255,255,255,.12);color:var(--top-ink)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--gold);color:#22272E;display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:11px;flex:none}
.appbody{padding:20px;display:grid;gap:16px;min-width:0}
.appbody h2{font-size:21px}.appbody h3{font-size:16px}
.mh{display:grid;gap:4px}.mh p{color:var(--muted);font-size:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.panel{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;background:var(--surface);align-content:start;min-width:0}
.panel.flat{background:var(--surface2)}
/* forms */
.field{display:grid;gap:4px;min-width:0}
.field label,.lab{font-weight:700;font-size:15px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;font-size:16px;min-width:0}
.field input:focus,.field textarea:focus,.field select:focus{outline:3px solid var(--gold);outline-offset:1px;border-color:var(--steel)}
.field small{color:var(--muted);font-size:13.5px}
.field.bad input,.field.bad textarea,.field.bad select{border-color:var(--bad)}
.field .err{color:var(--bad);font-weight:700}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15.5px;line-height:1.35}
.chk input{margin-top:3px;width:17px;height:17px;accent-color:var(--btn);flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:700;font-size:14.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.meter{height:9px;border-radius:99px;background:var(--chip);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--btn);border-radius:99px;transition:width .2s}
.meter.ok>i{background:var(--ok)}.meter.teal>i{background:var(--teal)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-family:var(--fd);font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--chip);color:var(--muted)}
.steps span.on{background:var(--ink);color:var(--bg)}.steps span.ok{background:var(--ok-bg);color:var(--ok)}
.opt{display:grid;gap:4px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;min-width:0}
.opt[aria-pressed="true"]{border-color:var(--btn);box-shadow:0 0 0 2px var(--btn) inset}
.opt h4{font-size:15px}.opt p{font-size:14.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:15px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
/* gates / timeline */
.gates{display:grid;gap:0}
.gate{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-align:left;background:none;border:0;border-left:3px solid var(--line);margin-left:14px;padding:8px 8px 8px 0;cursor:pointer;position:relative}
.gate .dot{position:absolute;left:-15px;width:27px;height:27px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--fd);font-weight:600;font-size:11px}
.gate span.t{grid-column:2;padding-left:26px;font-weight:700;font-size:16px}
.gate .pill{grid-column:3}
.gate.done{border-left-color:var(--ok)}.gate.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.gate.cur{border-left-color:var(--btn)}.gate.cur .dot{background:var(--btn);border-color:var(--btn);color:#fff}
.gate[aria-pressed="true"] span.t{text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--btn)}
.sc{display:grid;grid-template-columns:1fr 54px;gap:4px 10px;align-items:center}
.bar{height:10px;border-radius:99px;background:var(--chip);overflow:hidden}.bar>i{display:block;height:100%;background:var(--teal);border-radius:99px}
.bar.e>i{background:var(--btn)}.bar.g>i{background:var(--gold)}
input[type=range]{width:100%;accent-color:var(--btn)}
.thread{display:grid;gap:8px}
.msg{padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:15.5px;display:grid;gap:3px}
.msg.me{background:var(--info-bg);border-color:transparent}
.msg b{font-family:var(--fd);font-size:12px;font-weight:600}
.big{font-family:var(--fd);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.timer{font-family:var(--fd);font-weight:700;font-size:56px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);display:grid;gap:2px}
.tile span{font-size:13.5px;color:var(--muted)}
.fun{display:grid;gap:6px}
.fun .fr{display:grid;grid-template-columns:130px 1fr 40px;gap:10px;align-items:center;font-size:15px}
.fun .fr b{font-variant-numeric:tabular-nums;text-align:right}
@media (max-width:520px){.fun .fr{grid-template-columns:96px 1fr 34px}.appbody{padding:14px}}
/* spec panel */
.spec{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0;max-height:calc(100vh - 96px);display:flex;flex-direction:column;overflow:hidden}
@media (max-width:1180px){.spec{position:static;max-height:none}}
.spec header{padding:14px 16px 10px;display:grid;gap:6px;border-bottom:1px solid var(--line)}
.spec header .row{gap:8px}
.sid{font-family:var(--fd);font-weight:700;font-size:12px;background:var(--ink);color:var(--bg);padding:3px 9px;border-radius:6px;letter-spacing:.05em}
.spec h3{font-size:16px}
.stabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.stabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px;font-family:var(--fd);font-weight:500;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.stabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--btn);font-weight:600}
.sbody{padding:14px 16px 18px;overflow:auto;display:grid;gap:12px;align-content:start;font-size:15.5px}
.sbody ul,.sbody ol{margin:0;padding-left:20px;display:grid;gap:6px}
.req{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.req:last-child{border-bottom:0}
.req code{font-family:var(--fd);font-size:11.5px;font-weight:600;color:var(--muted)}
.pr{font-family:var(--fd);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;align-self:start;letter-spacing:.04em}
.pr.M{background:var(--btn);color:#fff}.pr.S{background:var(--info-bg);color:var(--blue)}.pr.C{background:var(--chip);color:var(--muted)}
/* legal */
.legal{display:grid;grid-template-columns:240px minmax(0,1fr);gap:26px;align-items:start;padding-bottom:30px}
@media (max-width:900px){.legal{grid-template-columns:minmax(0,1fr)}}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);display:grid;gap:2px;max-height:calc(100vh - 100px);overflow:auto;font-size:14.5px}
@media (max-width:900px){.toc{position:static;max-height:220px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface)}}
.toc button{background:none;border:0;text-align:left;padding:5px 8px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:700;line-height:1.3}
.toc button:hover{background:var(--chip);color:var(--ink)}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3vw,36px);display:grid;gap:18px;max-width:860px;min-width:0}
.doc h1{font-size:clamp(24px,3.4vw,34px)}
.doc h2{font-size:18px;margin-top:6px;scroll-margin-top:90px}
.doc section{display:grid;gap:8px}
.doc p,.doc li{font-size:17px;line-height:1.6}
.doc ul{margin:0;padding-left:22px;display:grid;gap:5px}
.doc .tw{margin-block:4px}

function viewHome(){
  const go=(t,to,cls='')=>`<button type="button" class="btn ${cls}" data-goto="${to}">${t}</button>`;
  const sc=(t,id,cls='')=>`<button type="button" class="btn ${cls}" data-act="scrollTo" data-v="${id}">${t}</button>`;
  const head=(eb,h,p,c='')=>`<div class="head ${c}"><span class="eb">${eb}</span><h2>${h}</h2>${p?`<p>${p}</p>`:''}</div>`;
  const steps=[
   ['apply','Oct to early Nov 2026','Apply','Share the problem, who has it and your idea. Take an optional readiness consultation first. No business plan needed.','Amara describes her surplus-food idea in five short steps.'],
   ['pitch','Nov 2026','Pitch Night','Present to the panel and the community. You are scored on a transparent eight-criterion scorecard.','She pitches for seven minutes and gets scored feedback.'],
   ['vet','Late Nov to Dec','Expert and sponsor vetting','Specialists challenge your evidence, market and plan. You answer through the platform.','Three experts ask who will pay. She goes out and finds evidence.'],
   ['top3','Dec 2026','Top 3 selection','Finalists present again. The panel deliberates and records the three ideas that move to build.','The panel records its decision. Her idea is in the Top 3.'],

let RVO=null;
function homeFx(){
  if(RVO){RVO.disconnect();RVO=null}
  const els=[...document.querySelectorAll('.rv')];
  if(!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  document.documentElement.classList.add('rvon');
  RVO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');RVO.unobserve(e.target)}}),{rootMargin:'0px 0px -8% 0px'});
  els.forEach(el=>RVO.observe(el));
}

A.pDlTog=el=>{const d=S.p.dl;if(!d.sel.includes(el.dataset.v)&&d.sel.length>=3){toast('Three finalists maximum');return}tog(d.sel,el.dataset.v)};
A.pDlRank=()=>{S.p.dl.sel=DELIB.map(r=>({id:r[0],m:dstat(r).m})).sort((a,b)=>b.m-a.m).slice(0,3).map(x=>x.id)};
A.pDlRec=()=>{S.p.dl.rec={id:'DR-2026-C01-0007',ts:stamp()}};
A.pDlReset=()=>{Object.assign(S.p.dl,{sel:[],why:'',conf:false,rec:null})};
/* sponsor */
A.sTSubmit=()=>{const t=S.s.t,e={};if(t.intent.trim().length<20)e.intent='Describe your contribution in at least 20 characters.';if(!t.conflict)e.conflict='Choose an answer.';t.errs=e;if(!Object.keys(e).length)t.sent=true};
A.sTReset=()=>{S.s.t.sent=false;S.s.t.errs={}};
A.sSign=()=>{S.s.ag.signed=true};
A.sAgReset=()=>{Object.assign(S.s.ag,{signed:false,ack:false,name:''})};
A.sReq=el=>{const r=S.s.pp.req,k=el.dataset.v;r[k]=!r[k];toast(r[k]?'Request sent. Waiting for the creator.':'Request withdrawn')};
A.sAddEx=()=>{const v=S.s.vt;v.ex.push({n:v.en.trim(),d:v.ed.trim(),st:'Invited'});v.en='';v.ed=''};
A.sAssess=()=>{const v=S.s.vt,e={};if(!v.ev)e.ev='Choose a rating.';if(!v.via)e.via='Choose a rating.';if(v.cm.trim().length<30)e.cm='Write at least 30 characters.';if(!v.ok)e.ok='Confirm you have no conflict, or recuse in the full product.';v.errs=e;if(!Object.keys(e).length)v.sent=true};
A.sRelease=el=>{S.s.fd.rel[el.dataset.v]=true;toast('Release approved and logged')};
A.sBrand=()=>{const f=S.s.fd;f.list.push({item:'Press release',text:f.bq.trim(),st:'Pending'});f.bq=''};
/* partner */
A.oSign=()=>{const a=S.o.ag,e={};if(a.name.trim().length<2)e.name='Enter the signatory name.';if(a.role.trim().length<2)e.role='Enter the signatory role.';if(CLAUSES.some((c,i)=>!a.cl[i]))e.cl='Accept every clause to sign.';a.errs=e;if(!Object.keys(e).length)a.signed=true};
A.oAgReset=()=>{Object.assign(S.o.ag,{signed:false,errs:{}})};
A.oCat=el=>{tog(S.o.ch.cats,el.dataset.v,8)};
A.oPublish=()=>{S.o.ch.pub=true;toast('Idea call published')};
A.oTpl=el=>{const m=S.o.mb,i=Number(el.dataset.v);m.tpl=i;m.msg=TPL[i]};
A.oSend=()=>toast('Approved. Queued for opted-in contacts only.');
A.oAddEx=()=>{const r=S.o.rs;r.ex.push({n:r.en.trim(),f:r.ef.trim(),c:'No conflicts declared',st:'Nominated'});r.en='';r.ef='';r.ec=false};
A.oReport=()=>{S.o.rs.rep=true};
/* shared */
A.accept=el=>{S.lg[el.dataset.v]=stamp()};
A.lgAll=el=>{document.querySelectorAll('.accd').forEach(d=>{d.open=el.dataset.v==='1'})};
A.scrollTo=el=>{const n=document.getElementById(el.dataset.v);if(n)n.scrollIntoView({behavior:'smooth',block:'start'})};
let THEME='auto';
A.theme=()=>{THEME=THEME==='auto'?'dark':THEME==='dark'?'light':'auto';const d=document.documentElement;if(THEME==='auto')d.removeAttribute('data-theme');else d.setAttribute('data-theme',THEME);$('#themeBtn').textContent='Theme: '+THEME[0].toUpperCase()+THEME.slice(1)};
/* live updaters (no re-render so typing keeps focus) */
LIVE.cPw=t=>{const n=pwScore(t.value);$('#pw-m i').style.width=n*25+'%';$('#pw-t').textContent=(t.value?['Weak','Weak','Fair','Good','Strong'][n]:'Not set')+'. Use 10 or more characters.'};
LIVE.cProf=()=>{const p=profPct(),a=$('#pf-p'),b=$('#pf-m i');if(a)a.textContent=p+'%';if(b)b.style.width=p+'%'};
let SAVE=null;
LIVE.cApLive=()=>{const s=$('#saveState');if(!s)return;s.textContent='Saving…';clearTimeout(SAVE);SAVE=setTimeout(()=>{S.c.ap.saved=new Date();const q=$('#saveState');if(q)q.textContent='Draft saved '+hhmm(S.c.ap.saved)},600)};
LIVE.cVetLive=()=>{};
LIVE.pLive=()=>{const b=$('#p-submit');if(b)b.disabled=!pScoreOk()};
LIVE.oLint=()=>{const m=S.o.mb,bad=BAD.test(m.msg),l=$('#lint'),b=$('#mb-send');if(l)l.innerHTML=bad?note('Brand check failed',`Remove promises or ownership claims. Found: <b>${esc((m.msg.match(BAD)||[''])[0])}</b>.`,'bad'):note('Brand check passed','No guarantees, ownership claims or funding promises found.','ok');if(b)b.disabled=bad};

/* ============ CORE ============ */
function cur(){if(J[S.tab])return {render:J[S.tab].screens[S.idx[S.tab]].r};if(S.tab==='terms'||S.tab==='privacy')return {render:()=>legalBody(S.tab)};return null}
function refresh(){
  const c=cur(),sc=$('#screen');if(!c||!sc)return;
  const a=document.activeElement,id=a&&a.id,pos=a&&typeof a.selectionStart==='number'&&a.type!=='number'&&a.type!=='date'?[a.selectionStart,a.selectionEnd]:null;
  sc.innerHTML=c.render();
  if(id){const n=document.getElementById(id);if(n&&!n.disabled){n.focus({preventScroll:true});if(pos&&n.setSelectionRange){try{n.setSelectionRange(pos[0],pos[1])}catch(_){}}}}
}
function render(){
  stopTimer();S.p.lv.run=false;
  const y=window.scrollY;
  $('#tabs').innerHTML=TABS.map(t=>`<button type="button" data-tab="${t[0]}" ${S.tab===t[0]?'aria-current="page"':''}>${t[2]?`<b>${t[2]}</b>`:''}${t[1]}</button>`).join('');
  $('#main').className=S.tab==='home'?'':'wrap';
  $('#main').innerHTML=S.tab==='home'?viewHome():J[S.tab]?viewJourney(S.tab):viewLegal(S.tab);
  if(S.tab==='home')homeFx();
  window.scrollTo({top:y})
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-goto],[data-set],[data-act],[data-copy]');
  if(!t||t.disabled)return;
  if(t.matches('a'))e.preventDefault();
  const d=t.dataset;
  if(d.tab){nav(d.tab);return}
  if(d.goto){const [tab,i]=d.goto.split(':');nav(tab,i!==undefined?Number(i):undefined);return}
  if(d.copy){const v=d.copy;try{navigator.clipboard.writeText(v).then(()=>toast('Copied')).catch(()=>toast('Copy this: '+v))}catch(_){toast('Copy this: '+v)}return}
  if(d.set!==undefined){set(d.set,pv(d.v));if(d.full!==undefined)render();else refresh();return}
  if(d.act){const f=A[d.act];if(f){const before=S.tab;f(t);if(S.tab===before&&d.act!=='theme'&&d.act!=='scrollTo'&&d.act!=='lgAll')refresh()}}
});
document.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.bind)return;
  if(t.type==='checkbox'||t.type==='radio'||t.tagName==='SELECT'||t.type==='file')return;
  set(t.dataset.bind,t.value);
  const c=document.getElementById('cnt-'+t.id);if(c)c.textContent=t.value.length;
  if(t.type==='date'||t.type==='number'){refresh();return}
  if(t.dataset.live&&LIVE[t.dataset.live])LIVE[t.dataset.live](t);
  /* re-render when a typed value gates a button */
  const gated=['c.tp.name','p.ob.','s.ag.','s.vt.','p.vt.','p.dl.','s.fd.bq','o.rs.','s.t.'];
  if(gated.some(g=>t.dataset.bind.startsWith(g)))refresh();
});
document.addEventListener('change',e=>{
  const t=e.target;if(!t.dataset)return;
  if(t.type==='file'&&t.dataset.files){const arr=get(t.dataset.files);[...t.files].forEach(f=>{if(arr.length<5)arr.push(f.name)});refresh();return}
  if(!t.dataset.bind)return;
  if(t.type==='checkbox')set(t.dataset.bind,t.checked);
  else if(t.tagName==='SELECT')set(t.dataset.bind,t.value);
  else return;
  refresh();
});
window.addEventListener('DOMContentLoaded',()=>{});
(function init(){
  $('#brand').innerHTML=`${logo(26)}<span>THE FOUNDRY</span>`;
  const h=(location.hash||'').replace('#','');if(['creator','panelist','sponsor','partner','terms','privacy'].includes(h))S.tab=h;
  render();
})();

</script>
</body></html>
